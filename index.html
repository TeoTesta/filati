<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Inventario filati</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1f7;--card:#fff;--ink:#2b2433;--mute:#6f667a;--acc:#7b3f7a;--accink:#fff;--line:#ddd6e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1720;--card:#272130;--ink:#f0ebf5;--mute:#a79db3;--acc:#c98ac7;--accink:#1b1720;--line:#3a3245}}
:root[data-theme="dark"]{--bg:#1b1720;--card:#272130;--ink:#f0ebf5;--mute:#a79db3;--acc:#c98ac7;--accink:#1b1720;--line:#3a3245}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}h1{font:700 26px/1.1 Georgia,serif;margin:4px 0 14px}
input{width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:17px}
h2{font-size:14px;margin:16px 0 6px;color:var(--mute);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;padding:9px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
button[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;margin-top:14px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.bar button{padding:6px 12px;font-size:14px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;border:1px solid var(--line)}
.dot{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line)}
.t{font-weight:700}.m{color:var(--mute);font-size:14px}.g{margin-left:auto;text-align:right;font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--mute);padding:30px 0}


.note{font-size:13px;color:var(--mute);margin-top:8px}
</style></head><body><main>
<h1>Inventario filati</h1>
<input id="q" type="search" placeholder="Cerca (es. merino, verde, 500)" autocomplete="off">
<h2>Fibra</h2><div class="chips" id="fib"></div>
<h2>Colore</h2><div class="chips" id="col"></div>
<div class="bar"><span id="cnt"></span><button id="rst">Azzera filtri</button></div>
<div id="list"></div><div class="note" id="warn"></div></main>
<script>
// >>> INCOLLA QUI il link CSV del foglio Google (tra le virgolette) <<<
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSFLNgCHWLLqOwCwp1YW0sRYvRyimHwZp8CKOkGpIXMQ8Oe7LShIMocX4cf-P5IIgQmBEcvMgDL1S80/pub?gid=2069149631&single=true&output=csv";
const BASE=[];
const FIB=[["Lana",/\bWO\b|\blana\b|wool/i],["Lana vergine",/\bWV\b/i],["Merino",/merino/i],["Cashmere",/\bWS\b|cash/i],["Mohair",/\bWM\b/i],["Alpaca",/\bWP\b|alpaca/i],["Cammello",/\bWK\b/i],["Angora",/\bWA\b/i],["Lambswool",/\bLW\b/i],["Cotone",/\bC\b|cotone/i],["Seta",/\bSE\b|seta/i]];
const COL=[["Bianco",/bianc/,"#f4f4f0"],["Beige",/beige|tortora|panna/,"#d9c7a6"],["Marrone",/marrone|ramato|biscotto/,"#7a5236"],["Verde",/verd|petrolio|oliva|salvia|lime|foresta/,"#4f8a5b"],["Blu",/blu|azzurr/,"#3f6fb5"],["Viola",/lilla|porpora|viola/,"#8e5fa8"],["Rosso",/ross|bordeaux|vinaccia/,"#a5323f"],["Grigio",/grig/,"#9a9aa2"],["Giallo",/giallo|senape/,"#dcb232"],["Arancio",/aranc|rame/,"#d9803a"],["Nero",/nero/,"#222"]];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const g=s=>(s.match(/\d+/g)||[]).reduce((a,b)=>a+ +b,0);
function parseCSV(t){const o=[];let r=[],f="",q=false;t=t.replace(/^\uFEFF/,"");for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==","){r.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);f="";o.push(r);r=[]}else f+=c}if(f||r.length){r.push(f);o.push(r)}return o.slice(1).map(x=>[0,1,2,3].map(i=>(x[i]||"").trim())).filter(x=>x[0]||x[1])}
let R=[];const S={f:new Set(),k:new Set()};
function model(rows){return rows.map(([c,m,p,pr])=>({c,m:m||"Materiale non indicato",p,pr,gr:g(p),f:FIB.filter(x=>x[1].test(m)).map(x=>x[0]),k:COL.filter(x=>x[1].test(c.toLowerCase())).map(x=>x[0])}))}
function chips(id,arr,set,key){const e=$(id);e.innerHTML="";arr.forEach(x=>{const n=x[0];if(!R.some(r=>r[key].includes(n))){set.delete(n);return}const b=document.createElement("button");b.textContent=n;b.setAttribute("aria-pressed",set.has(n));b.onclick=()=>{set.has(n)?set.delete(n):set.add(n);b.setAttribute("aria-pressed",set.has(n));draw()};e.appendChild(b)})}
function load(rows){R=model(rows);chips("fib",FIB,S.f,"f");chips("col",COL,S.k,"k");draw()}
const q=$("q");q.oninput=draw;
$("rst").onclick=()=>{q.value="";S.f.clear();S.k.clear();load(rawRows)};
function draw(){const t=q.value.toLowerCase().trim();
const L=R.filter(r=>(!S.f.size||r.f.some(x=>S.f.has(x)))&&(!S.k.size||r.k.some(x=>S.k.has(x)))&&(!t||(r.c+" "+r.m+" "+r.p+" "+r.pr).toLowerCase().includes(t)));
$("cnt").textContent=L.length+" filati · "+L.reduce((a,r)=>a+r.gr,0)+" gr in totale";
$("list").innerHTML=L.length?L.map(r=>{const h=(COL.find(x=>x[0]==r.k[0])||[0,0,"#ccc"])[2];return `<div class="card"><div class="dot" style="background:${h}"></div><div><div class="t">${esc(r.c)}</div><div class="m">${esc(r.m)}${r.pr?" · "+esc(r.pr):""}</div></div><div class="g">${esc(r.p||"–")}</div></div>`}).join(""):'<div class="empty">Nessun filato trovato. Prova a togliere qualche filtro.</div>'}
let rawRows=BASE;load(rawRows);
if(!CSV_URL)$("warn").textContent="Manca il link del foglio Google: va incollato nella riga CSV_URL del file.";
if(CSV_URL){fetch(CSV_URL+(CSV_URL.includes("?")?"&":"?")+"t="+Date.now()).then(r=>{if(!r.ok)throw new Error("errore "+r.status);return r.text()}).then(t=>{const a=parseCSV(t);if(!a.length)throw new Error("nessuna riga letta");rawRows=a;load(a)}).catch(e=>{$("warn").textContent="Non riesco a leggere il foglio online: riprova tra poco. ["+(e&&e.message?e.message:e)+"]"})}
</script></body></html>
