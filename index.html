<!-- Indica al browser di interpretarlo come HTML5-->
<!DOCTYPE html> 
<!-- Setta la lingua della pagina Web-->
<html lang="it">
    <!-- HEAD: informazioni "dietro le quinte" (titolo, stile, impostazioni). Non viene mostrato nella pagina -->
    <head>
        <!-- charset utf-8: permette di scrivere correttamente lettere accentate e simboli (es. "·") -->
        <!-- viewport -> usa la larghezza reale dello schermo: senza, il telefono mostrerebbe la pagina rimpicciolita come se fosse un PC -->
        <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <!-- Titolo mostrato nella scheda del browser -->
        <title>Inventario filati</title>
        <!-- Dentro <style> c'è il CSS: l'aspetto grafico (colori, spazi, dimensioni). I commenti CSS si scrivono con /* ... */ -->
        <style>
            /* Definizione delle variabili CSS.
               Una variabile si dichiara con --nome:valore e si usa con var(--nome).
               Vantaggio: per cambiare un colore in tutta la pagina basta modificarlo qui, in un solo punto */
            /* :root fa riferimento al tag html */
            :root
            {
                box-sizing:border-box; /*Quasi tutti i siti moderni lo usano per dimensioni del box*/ 
                padding-top:env(safe-area-inset-top,0px); /*Serve per smartphone con notch. Default 0*/
                padding-bottom:env(safe-area-inset-bottom,0px); /*Serve per evitare che il contenuto finisca sotto barra gesture Android o iPhone*/
                --bg:#f4f1f7; /*variabili css colore: sfondo della pagina*/
                --card:#fff; /* sfondo di schede, campo di ricerca e pulsanti */
                --ink:#2b2433; /* colore del testo principale */
                --mute:#6f667a; /* colore del testo secondario (meno evidente) */
                --acc:#7b3f7a; /* colore "accento": pulsanti attivi */
                --accink:#fff; /* colore del testo sopra l'accento */
                --line:#ddd6e6 /* colore dei bordi */
            }
            /* Dark Mode:
                se Windows o il telefono sono in modalità scura, applica automaticamente il tema scuro
                (ridefinisce le stesse variabili con colori scuri: il resto del CSS non cambia) */
            @media (prefers-color-scheme:dark)
            {
                :root:not([data-theme="light"])
                {
                    --bg:#1b1720;
                    --card:#272130;
                    --ink:#f0ebf5;
                    --mute:#a79db3;
                    --acc:#c98ac7;
                    --accink:#1b1720;
                    --line:#3a3245
                }
            }
            /* Se l'HTML forza il tema scuro con data-theme="dark" (non usato in questa pagina, ma resta come opzione) */
            :root[data-theme="dark"]
            {
                --bg:#1b1720;
                --card:#272130;
                --ink:#f0ebf5;
                --mute:#a79db3;
                --acc:#c98ac7;
                --accink:#1b1720;
                --line:#3a3245
            }
            /* *{ è un selettore universale, applica la regola a tutti gli elementi.
               border-box: larghezza e altezza includono bordo e padding, così i calcoli delle dimensioni sono più prevedibili */
            *{
                box-sizing:border-box
            }
             /* inizio definizione stili per gli altri elementi */
            /* body: tutto il contenuto visibile. Qui si imposta sfondo, colore del testo e carattere (font) */
            body{
                margin:0; /* toglie il margine di default del browser */
                background:var(--bg);
                color:var(--ink);
                font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif /* dimensione/interlinea e elenco di caratteri: usa il primo disponibile sul dispositivo */
            }
            
            /* main: la colonna centrale con tutto il contenuto */
            main{
                max-width:560px; /* su PC non diventa troppo larga */
                margin:0 auto; /* auto a destra e sinistra = centrata */
                padding:16px /* spazio interno dai bordi */
            }
            
            /* h1: il titolo grande */
            h1{
                font:700 26px/1.1 Georgia,serif; /* 700 = grassetto, 26px = dimensione, 1.1 = interlinea */
                margin:4px 0 14px /* ordine: sopra, destra/sinistra, sotto */
            }
            
            /* input: il campo di ricerca */
            input{
                width:100%;
                padding:14px;
                border:2px solid var(--line);
                border-radius:14px; /* angoli arrotondati */
                background:var(--card);
                color:var(--ink);
                font-size:17px /* almeno 16px: evita lo zoom automatico su iPhone quando si tocca il campo */
            }
            
            /* h2: le etichette "Fibra" e "Colore" */
            h2{
                font-size:14px;
                margin:16px 0 6px;
                color:var(--mute);
                font-weight:600
            }
            
            /* button: stile base di tutti i pulsanti (filtri e "Azzera filtri") */
             button{
                font:inherit; /* usa lo stesso carattere del resto della pagina (di default i pulsanti usano il loro) */
                padding:9px 14px;
                border-radius:999px; /* valore enorme = forma a pillola */
                border:2px solid var(--line);
                background:var(--card);
                color:var(--ink)
            }
            /* stile bottoni quando premuti, invece dello stile standard button sopra.
               [aria-pressed=true] è un selettore di attributo: vale solo per i pulsanti con aria-pressed="true",
               che il JavaScript imposta quando un filtro è attivo */
            button[aria-pressed=true]{
                background:var(--acc);
                color:var(--accink);
                border-color:var(--acc)
            }
            /* definizione classe chips, contiene il pulsante dei filtri.
               Il punto davanti al nome (.chips) indica una classe, usata nell'HTML con class="chips" */
            .chips{
                display:flex; /* flexbox: gli elementi interni si dispongono in riga */
                flex-wrap:wrap; /* se non c'è spazio vanno a capo */
                gap:8px /* spazio tra un pulsante e l'altro */
            }
            /* definizione classe bar, contiene il num filtri e il tasto Azzera filtri */
            .bar{
                position:sticky; /* resta fissa in alto quando si scorre la lista */
                top:env(safe-area-inset-top,0px);
                background:var(--bg); /* sfondo pieno, altrimenti le schede si vedrebbero sotto */
                padding:10px 0;
                margin-top:14px;
                display:flex;
                justify-content:space-between; /* contatore a sinistra, pulsante a destra */
                align-items:center; /* allineati in verticale */
                font-weight:600
            }
            /* ".bar button" = solo i pulsanti dentro .bar: li rende più piccoli */
            .bar button{padding:6px 12px;font-size:14px}
            /* definizione classe card, contiene la scheda di ogni filato */
            .card{
                background:var(--card);
                border-radius:14px;
                padding:12px 14px;
                margin-bottom:10px; /* spazio tra una scheda e la successiva */
                display:flex; /* cerchio colorato, testo e peso sono messi in riga */
                gap:12px;
                border:1px solid var(--line)
            }
            /* definizione classe dot, contiene il cerchietto colorato */
            .dot{
                flex:none; /* non si deve restringere */
                width:34px;
                height:34px;
                border-radius:50%; /* 50% = cerchio perfetto */
                border:1px solid var(--line)
            }

            /* .t = titolo della scheda (il colore del filato) */
            .t{
                font-weight:700}
            /* .m = riga secondaria (materiale e prezzo) */
            .m{
                color:var(--mute);font-size:14px
            }
            /* .g = il peso, a destra della scheda */
            .g{
                margin-left:auto; /* spinge l'elemento all'estrema destra */
                text-align:right;
                font-weight:700;
                white-space:nowrap /* evita che "395 gr" vada a capo */
            }
            
            /* .empty = messaggio "Nessun filato trovato" */
            .empty{
                text-align:center;
                color:var(--mute);
                padding:30px 0
            }
            
            /* .note = riga piccola in fondo, usata per gli avvisi di errore */
            .note{
                font-size:13px;
                color:var(--mute);
                margin-top:8px
            }
        </style>
    </head>
    <!-- BODY: tutto ciò che si vede nella pagina. Qui l'HTML è solo lo "scheletro" vuoto:
         liste e pulsanti vengono riempiti dal JavaScript più sotto, usando gli id come punti di aggancio -->
    <body>
        <main>
            <h1>Inventario filati</h1> <!-- Titolo-->
            <input id="q" type="search" placeholder="Cerca (es. merino, verde, 500)" autocomplete="off"> <!-- Campo ricerca dove l'utente scrive. id="q" serve al JavaScript per trovarlo -->
            <!-- Contenitori dei pulsanti-filtro: il JS ci crea dentro un pulsante per ogni fibra e colore presenti nei dati -->
            <h2>Fibra</h2><div class="chips" id="fib"></div>
            <h2>Colore</h2><div class="chips" id="col"></div>
            <div class="bar">
                <span id="cnt"></span> <!-- Qui il JS scrive "N filati · N gr in totale" -->
                <button id="rst">Azzera filtri</button>
            </div>
            <div id="list"></div> <!-- Qui il JS inserisce le schede dei filati -->
            <div class="note" id="warn"></div></main> <!-- Div che contiene eventuale errore-->
        <!-- SCRIPT: il JavaScript, cioè la logica della pagina (leggere i dati, filtrare, disegnare le schede) -->
        <script>
            // const è una variabile che non verrà più riassegnata nello script
            // const CSV_URL puntamento al file con i dati
            // (è il link "Pubblica sul web" del foglio Google, in formato CSV)
            const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSFLNgCHWLLqOwCwp1YW0sRYvRyimHwZp8CKOkGpIXMQ8Oe7LShIMocX4cf-P5IIgQmBEcvMgDL1S80/pub?gid=2069149631&single=true&output=csv";
            // const BASE=[]; crea un array vuoto. È l'elenco di partenza: resta vuoto finché non arrivano i dati dal foglio.
            // Ogni riga sarà un array di 4 testi: [colore, materiale, peso, prezzo]
            const BASE=[];
            /* const FIB -> crea array di array. es primo elemento per const FIB: [
                                                                                                    "Lana", -> Nome categoria
                                                                                                    /\bWO\b|\blana\b|wool/i -> Considera categoria lana quando trovaWO, lana o wool
                                                                                                   ]
            Sintassi: /merino/i -> cerca la parola merino ignorando maiuscole e minuscole.
                      /\bWO\b/ -> confine di parola, serve ad evitare falsi positivi. Esempio WO all'interno di parole tipo CIAOWO123, da non considerare
                      | -> significa "oppure": /WO|lana/ trova WO oppure lana
            Per aggiungere una fibra basta aggiungere una riga [nome, regex] in questo elenco: il pulsante comparirà da solo
            quando almeno un filato la contiene                                                       */
            const FIB=[
                ["Lana",/\bWO\b|\blana\b|wool/i],
                ["Lana vergine",/\bWV\b/i],
                ["Merino",/merino/i],
                ["Cashmere",/\bWS\b|cash/i],
                ["Mohair",/\bWM\b/i],
                ["Alpaca",/\bWP\b|alpaca/i],
                ["Cammello",/\bWK\b/i],
                ["Angora",/\bWA\b/i],
                ["Lambswool",/\bLW\b/i],
                ["Cotone",/\bC\b|cotone/i],
                ["Seta",/\bSE\b|seta/i]
            ];
            /* const COL -> array dei colori, formato da [
                                                            nome,
                                                            regex,
                                                            colore css
                                                         ]
            La regex cerca nel testo del colore (già in minuscolo): es. "verd" trova verde, verdone, verdino.
            Il colore css (es. "#4f8a5b") è quello del cerchietto mostrato nella scheda.
            Per aggiungere un colore o una sfumatura basta una riga nuova o una parola in più dopo un |
            */
            const COL=[
                ["Bianco",/bianc/,"#f4f4f0"],
                ["Beige",/beige|tortora|panna/,"#d9c7a6"],
                ["Marrone",/marrone|ramato|biscotto/,"#7a5236"],
                ["Verde",/verd|petrolio|oliva|salvia|lime|foresta/,"#4f8a5b"],
                ["Blu",/blu|azzurr/,"#3f6fb5"],
                ["Viola",/lilla|porpora|viola/,"#8e5fa8"],
                ["Rosso",/ross|bordeaux|vinaccia/,"#a5323f"],
                ["Grigio",/grig/,"#9a9aa2"],
                ["Giallo",/giallo|senape/,"#dcb232"],
                ["Arancio",/aranc|rame/,"#d9803a"],
                ["Nero",/nero/,"#222"]
            ];
            // Shortcut -> crea una scorciatoia: $("list") equivale a document.getElementById("list"),
            // cioè "trova nella pagina l'elemento con id list". Si usa ovunque nello script per non ripetere il nome lungo.
            const $=id=>document.getElementById(id);
            // Questa è una funzione di sicurezza, serve per evitare che nel testo compaiano caratteri HTML speciali.
            // Sostituisce & < > " con i loro codici (es. < diventa &lt;), così un testo scritto nel foglio non può "rompere" la pagina.
            const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
            // s.match(/\d+/g) -> estrae i numeri, .reduce((a,b)=>a+ +b,0) somma gli elementi estratti
            // es. "550 gr+540 gr" -> ["550","540"] -> 1090. Il "+b" trasforma il testo in numero. Se non ci sono numeri: || [] evita l'errore e il risultato è 0
            const g=s=>(s.match(/\d+/g)||[]).reduce((a,b)=>a+ +b,0);

            // parsa il csv rendendo i dati utilizzabili, riceve rosso,lana,500 e li trasforma in  ["rosso","lana","500"]
            // Un CSV è un testo con una riga per filato e i campi separati da virgole. Qui lo leggiamo carattere per carattere.
            // Le virgolette servono quando un campo contiene una virgola (es. "70% merino, 30% seta"): dentro le virgolette la virgola NON separa i campi.
            function parseCSV(testo)
            {
                const righe=[];              // risultato: elenco di righe, ogni riga è un array di campi
                let riga=[];                 // la riga che stiamo costruendo
                let campo="";                // il campo che stiamo costruendo
                let dentroVirgolette=false;  // true se siamo dentro un campo tra virgolette
                testo=testo.replace(/^\uFEFF/,""); // toglie un carattere invisibile (BOM) che Excel/Google possono mettere all'inizio

                for(let i=0;i<testo.length;i++)
                {
                    const c=testo[i]; // carattere corrente
                    if(dentroVirgolette)
                    {
                        if(c=='"')
                        {
                            // due virgolette di fila ("") = una virgoletta vera dentro il testo; una sola = fine del campo
                            if(testo[i+1]=='"'){campo+='"';i++}
                            else dentroVirgolette=false;
                        }
                        else campo+=c; // dentro le virgolette ogni carattere (anche virgole e a capo) fa parte del campo
                    }
                    else if(c=='"') dentroVirgolette=true;           // inizia un campo tra virgolette
                    else if(c==","){riga.push(campo);campo=""}       // virgola = fine del campo, si passa al successivo
                    else if(c=="\n"||c=="\r")                        // a capo = fine della riga
                    {
                        if(c=="\r"&&testo[i+1]=="\n")i++;            // Windows usa \r\n: si salta il secondo carattere per non contare due righe
                        riga.push(campo);campo="";
                        righe.push(riga);riga=[];
                    }
                    else campo+=c;                                   // carattere normale: si aggiunge al campo
                }
                // ultima riga: se il file non finisce con un a capo, va salvata qui
                if(campo||riga.length){riga.push(campo);righe.push(riga)}

                return righe
                    .slice(1)                                              // salta la prima riga (le intestazioni: Colore, Materiale...)
                    .map(x=>[0,1,2,3].map(i=>(x[i]||"").trim()))           // tiene solo le prime 4 colonne; i vuoti diventano ""; trim() toglie gli spazi ai bordi
                    .filter(x=>x[0]||x[1]);                                // scarta le righe senza colore e senza materiale (righe vuote)
            }

            // R = elenco "arricchito" dei filati su cui lavorano filtri e ricerca (vedi model)
            let R=[];
            // S = filtri attualmente attivi. Set = insieme di valori senza duplicati.
            // S.f = fibre selezionate, S.k = colori selezionati
            const S={f:new Set(),k:new Set()};

            // model: trasforma ogni riga [colore, materiale, peso, prezzo] in un oggetto con campi comodi per filtrare:
            //   c = colore, m = materiale, p = peso (testo), pr = prezzo
            //   gr = peso in grammi (numero, serve per il totale)
            //   f = elenco delle fibre trovate nel materiale (es. ["Merino","Cashmere"])
            //   k = elenco dei colori trovati nel nome del colore (es. ["Verde"])
            function model(rows)
            {
                return rows.map(([c,m,p,pr])=>({
                    c,
                    m:m||"Materiale non indicato", // se il materiale è vuoto mostra questo testo
                    p,
                    pr,
                    gr:g(p),
                    f:FIB.filter(x=>x[1].test(m)).map(x=>x[0]),               // tiene le fibre la cui regex trova una corrispondenza nel materiale, poi ne prende solo il nome
                    k:COL.filter(x=>x[1].test(c.toLowerCase())).map(x=>x[0])  // come sopra per i colori, in minuscolo perché le regex dei colori sono minuscole
                }));
            }

            // chips: crea i pulsanti-filtro dentro il contenitore con quell'id.
            //   id = id del contenitore ("fib" o "col"), arr = elenco (FIB o COL),
            //   set = filtri attivi (S.f o S.k), key = campo da controllare ("f" o "k")
            function chips(id,arr,set,key)
            {
                const e=$(id);
                e.innerHTML=""; // svuota i pulsanti precedenti prima di ricrearli
                arr.forEach(x=>{
                    const n=x[0]; // nome della fibra o del colore
                    // se nessun filato ha questa fibra/colore non si crea il pulsante (e si toglie dai filtri attivi)
                    if(!R.some(r=>r[key].includes(n))){set.delete(n);return}
                    const b=document.createElement("button"); // crea un pulsante nuovo
                    b.textContent=n;
                    b.setAttribute("aria-pressed",set.has(n)); // true/false: il CSS lo usa per colorare i pulsanti attivi
                    // al tocco: se il filtro era attivo lo toglie, altrimenti lo aggiunge; poi aggiorna l'aspetto e ridisegna la lista
                    b.onclick=()=>{
                        set.has(n)?set.delete(n):set.add(n);
                        b.setAttribute("aria-pressed",set.has(n));
                        draw()
                    };
                    e.appendChild(b); // inserisce il pulsante nella pagina
                });
            }

            // load: riceve le righe, le trasforma con model(), ricrea i pulsanti-filtro e ridisegna la lista
            function load(rows)
            {
                R=model(rows);
                chips("fib",FIB,S.f,"f");
                chips("col",COL,S.k,"k");
                draw();
            }

            // q = campo di ricerca. q.oninput=draw: a ogni lettera digitata si richiama draw e la lista si aggiorna subito
            const q=$("q");q.oninput=draw;
            // "Azzera filtri": svuota la ricerca e i filtri attivi, poi ricarica le righe (rawRows) per ricostruire i pulsanti
            $("rst").onclick=()=>{q.value="";S.f.clear();S.k.clear();load(rawRows)};

            // draw: disegna la lista. Applica filtri e ricerca, aggiorna il contatore e crea una scheda per ogni filato rimasto
            function draw()
            {
                const t=q.value.toLowerCase().trim(); // testo cercato, in minuscolo e senza spazi ai bordi
                // L = filati che passano TUTTE le condizioni:
                //   1) nessuna fibra selezionata OPPURE il filato ha almeno una delle fibre selezionate
                //   2) lo stesso per i colori
                //   3) nessun testo cercato OPPURE il testo compare in colore, materiale, peso o prezzo
                const L=R.filter(r=>
                    (!S.f.size||r.f.some(x=>S.f.has(x)))&&
                    (!S.k.size||r.k.some(x=>S.k.has(x)))&&
                    (!t||(r.c+" "+r.m+" "+r.p+" "+r.pr).toLowerCase().includes(t))
                );
                // contatore: numero di filati e somma dei grammi
                $("cnt").textContent=L.length+" filati · "+L.reduce((a,r)=>a+r.gr,0)+" gr in totale";
                // lista: se ci sono filati, per ognuno costruisce il blocco HTML della scheda, altrimenti mostra "Nessun filato trovato"
                $("list").innerHTML=L.length
                    ? L.map(r=>{
                        // colore del cerchietto: quello del primo colore trovato; se non ne trova nessuno usa un grigio (#ccc)
                        const h=(COL.find(x=>x[0]==r.k[0])||[0,0,"#ccc"])[2];
                        // ${...} inserisce un valore dentro il testo; esc() protegge dai caratteri speciali.
                        // Il prezzo si mostra solo se presente; se il peso è vuoto compare un trattino
                        return `<div class="card"><div class="dot" style="background:${h}"></div><div><div class="t">${esc(r.c)}</div><div class="m">${esc(r.m)}${r.pr?" · "+esc(r.pr):""}</div></div><div class="g">${esc(r.p||"–")}</div></div>`
                    }).join("") // unisce tutte le schede in un unico testo HTML
                    : '<div class="empty">Nessun filato trovato. Prova a togliere qualche filtro.</div>';
            }

            // AVVIO. rawRows = righe lette dal foglio. Parte con BASE (vuoto) e viene aggiornata appena arrivano i dati.
            let rawRows=BASE;load(rawRows);
            // se nella riga CSV_URL non c'è nessun link, mostra un avviso
            if(!CSV_URL)$("warn").textContent="Manca il link del foglio Google: va incollato nella riga CSV_URL del file.";
            // Se il link c'è, scarica il CSV con fetch (richiesta di rete asincrona: le istruzioni .then partono solo quando arriva la risposta).
            //   Date.now() aggiunto al link serve a evitare che il browser mostri una copia vecchia salvata in cache.
            //   1) .then: controlla che la risposta sia ok (altrimenti genera un errore) e ne estrae il testo
            //   2) .then: trasforma il testo in righe con parseCSV; se non ce ne sono genera un errore; altrimenti le salva e ridisegna con load()
            //   .catch: se qualcosa va storto (rete assente, link sbagliato...) mostra l'avviso con il motivo tra parentesi quadre
            if(CSV_URL)
            {
                fetch(CSV_URL+(CSV_URL.includes("?")?"&":"?")+"t="+Date.now())
                    .then(r=>{if(!r.ok)throw new Error("errore "+r.status);return r.text()})
                    .then(t=>{const a=parseCSV(t);if(!a.length)throw new Error("nessuna riga letta");rawRows=a;load(a)})
                    .catch(e=>{$("warn").textContent="Non riesco a leggere il foglio online: riprova tra poco. ["+(e&&e.message?e.message:e)+"]"})
            }
        </script>
    </body>
</html>
